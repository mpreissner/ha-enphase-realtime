name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  test:
    name: ruff + pytest (py3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Home Assistant 2026.8, the oldest release supported, requires 3.14.
          python-version: "3.14"

      - name: Install dev toolchain
        # --group needs pip 25.1+, which is newer than some runner images ship.
        run: |
          python -m pip install --upgrade pip
          pip install --group dev

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Test
        run: pytest -q

  ha-tests:
    name: HA tests (py3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Whatever current Home Assistant requires; pytest-homeassistant-custom-component
          # pins the matching HA release.
          python-version: "3.14"

      - name: Install Home Assistant test harness
        run: |
          python -m pip install --upgrade pip
          pip install --group ha

      - name: Test
        # The package root, not the integration directory: HA must import the integration
        # as custom_components.enphase_realtime, or its exception classes load twice.
        run: pytest -q -o pythonpath=. tests_ha

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    # HACS can't read private repos, so its manifest checks fail until the repo is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
          # Brand icons live in home-assistant/brands, not this repo.
          ignore: brands
